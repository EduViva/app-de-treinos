<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ficha do Eduardo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16181D; --ink-2:#4A505A; --paper:#FFFFFF; --paper-2:#F3F5F8;
  --rule:#D5DCE4; --rule-strong:#8793A3;
  --fA:#F3D65C; --fB:#A9CBEF; --fC:#F4B7B0; --fD:#B5DDB0; --fE:#CDBDF0; --fR:#F6B774; --fX:#D6D8DC; --fM:#A9DCCB; --fP:#E7DAC0;
  --hA:#F3D65C; --hB:#A9CBEF; --hC:#F4B7B0; --hD:#B5DDB0; --hE:#CDBDF0; --hR:#F6B774; --hX:#D6D8DC; --hM:#A9DCCB; --hP:#E7DAC0;
  --bar:#16181D; --bar-ink:#FFFFFF; --scrim:rgba(12,14,18,.5);
  --s1:#2a78d6; --s2:#eb6834;
  --font:"Archivo","Helvetica Neue",Arial,system-ui,sans-serif;
  --page:var(--paper); --tc:var(--fX); --hi:var(--hX);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EEF0F3; --ink-2:#AEB5BF; --paper:#1D1F23; --paper-2:#25282D;
    --rule:#353A42; --rule-strong:#6E7885;
    --fA:#3D3410; --fB:#1C3350; --fC:#472420; --fD:#1F4028; --fE:#322850; --fR:#4A2C10; --fX:#2C2F34; --fM:#17372F; --fP:#3A3326;
    --hA:#7A6719; --hB:#3C6591; --hC:#8E4A43; --hD:#3E7A4C; --hE:#6552A0; --hR:#8F5520; --hX:#5A5F68; --hM:#3F7A68; --hP:#7A6A45;
    --bar:#2B2E34; --bar-ink:#EEF0F3; --scrim:rgba(0,0,0,.6);
  --s1:#3987e5; --s2:#d95926; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#EEF0F3; --ink-2:#AEB5BF; --paper:#1D1F23; --paper-2:#25282D;
  --rule:#353A42; --rule-strong:#6E7885;
  --fA:#3D3410; --fB:#1C3350; --fC:#472420; --fD:#1F4028; --fE:#322850; --fR:#4A2C10; --fX:#2C2F34; --fM:#17372F; --fP:#3A3326;
  --hA:#7A6719; --hB:#3C6591; --hC:#8E4A43; --hD:#3E7A4C; --hE:#6552A0; --hR:#8F5520; --hX:#5A5F68; --hM:#3F7A68; --hP:#7A6A45;
  --bar:#2B2E34; --bar-ink:#EEF0F3; --scrim:rgba(0,0,0,.6);
  --s1:#3987e5; --s2:#d95926; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
/* o fundo do documento é o da barra escura: é a cor que o navegador usa atrás dos botões do celular; a página pinta a própria cor por cima */
html{height:100%;background:var(--bar);scroll-padding-top:16px;scroll-padding-bottom:180px}
body{transition:background-color .35s ease;margin:0;padding-top:env(safe-area-inset-top,0px);min-height:100%;background:var(--page);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;transition:background-color .25s ease}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;line-height:1.08}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:560px;margin:0 auto;padding:8px 16px calc(130px + env(safe-area-inset-bottom,0px));overflow-x:clip}
.x{font-stretch:125%}
.muted{color:var(--ink-2)}
svg{flex:none}

/* ---------- Cabeçalho do dia ---------- */
.topline{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px}
.topline .wl{font-weight:800;font-size:17px;font-stretch:112.5%}
.wk{display:flex;align-items:center;font-size:14px;font-weight:600}
.ib{flex:none;width:44px;height:44px;border:0;background:none;border-radius:50%;display:grid;place-items:center;padding:0}
.ib:active{background:color-mix(in srgb,var(--ink) 12%,transparent)}
.ib svg{width:20px;height:20px}
.linkbtn{border:0;background:none;min-height:44px;min-width:44px;padding:0 6px;font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.tabs{display:grid;grid-template-columns:repeat(var(--cols,7),1fr);gap:4px;margin-top:4px;border-bottom:1.5px solid var(--ink);align-items:end}
.tab{position:relative;border:1.5px solid var(--ink);border-bottom:0;border-radius:10px 10px 0 0;background:var(--c);min-height:54px;padding:5px 0 5px;display:grid;justify-items:center;align-content:end;gap:1px;transition:min-height .15s ease}
.tab .d{font-size:12px;font-weight:500;line-height:1.1}
.tab .g{font-size:20px;font-weight:900;font-stretch:125%;line-height:1.05}
.tab .g.s{font-size:15px;font-stretch:100%;font-weight:800}
.tab.today .d{font-weight:800;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px}
.tab[aria-current="date"],.tab[aria-pressed="true"]{min-height:64px;margin-bottom:-1.5px;padding-bottom:6.5px}
.tab .ok{position:absolute;top:-7px;right:-5px;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--page);display:grid;place-items:center}
.tab .ok svg{width:11px;height:11px}

/* ---------- Herói da ficha ---------- */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 16px;align-items:center;padding:2px 0 4px}
.hero.solo{grid-template-columns:minmax(0,1fr)}
.hero h1{display:grid;font-weight:900;margin:0}
.hmeta{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px;margin-bottom:6px}
.hmeta.runmeta{margin:6px 0 0}
.hl1{display:flex;flex-wrap:wrap;align-items:center;column-gap:10px;min-width:0}
.when{font-size:15px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.dtools{display:inline-flex;flex-wrap:wrap;column-gap:6px}
.dtools .linkbtn{font-size:12px;font-weight:700;min-height:40px;padding:0 4px;color:var(--ink-2)}
.dur{position:relative;display:inline-flex;align-items:center;gap:5px;min-height:28px;padding:0 10px 0 8px;border:1.5px solid var(--ink);border-radius:999px;background:color-mix(in srgb,var(--paper) 55%,transparent);font-weight:700;font-size:13px;line-height:1;white-space:nowrap;flex:none}
.dur::after{content:"";position:absolute;inset:-8px -4px}
button.dur:active{background:var(--paper)}
.dur svg{width:15px;height:15px}
.hero .hl{font-size:clamp(116px,34vw,164px);font-stretch:125%;line-height:.8;letter-spacing:-.03em}
.hero .hl.word{font-size:clamp(64px,19vw,92px);letter-spacing:-.02em;line-height:.85;margin-top:2px}
.hero .f{font-size:17px;font-weight:700;line-height:1.3;overflow-wrap:anywhere;min-width:0}
.hero.solo .f{margin-top:10px}
.tally{display:flex;align-items:center;gap:12px;margin:16px 0 18px}
.tally svg{height:30px;width:auto;max-width:62%}
.tally .cnt{margin-left:auto;display:flex;align-items:baseline;gap:1px;font-size:22px;font-weight:900;font-stretch:112.5%;line-height:1;white-space:nowrap}
.tally .cnt b{font-weight:900}
.tally .cnt small{font-size:12px;font-weight:700;font-stretch:100%;color:var(--ink-2);margin-left:6px}

.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--ink);border-radius:14px;overflow:hidden;margin:0 0 18px;background:var(--paper)}
.seg button{border:0;background:none;min-height:48px;font-weight:700;font-size:15px}
.seg button + button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* ---------- A ficha (tabela) ---------- */
.sheet{background:var(--paper);border:1.5px solid var(--ink);border-radius:16px;overflow:hidden}
.thead,.row{display:grid;grid-template-columns:32px minmax(0,1fr) repeat(var(--n),52px);column-gap:5px}
.thead{padding:9px 10px 7px;border-bottom:1.5px solid var(--ink);font-size:12px;font-weight:700;color:var(--ink-2)}
.thead span:nth-child(n+3){text-align:center}
.grp{border-bottom:1.5px solid var(--ink)}
.grp:last-of-type{border-bottom:0}
.rows{position:relative;padding:4px 0}
.grp.multi .rows::before{content:"";position:absolute;left:8px;top:22px;bottom:22px;width:8px;border:2px solid var(--ink);border-right:0;border-radius:6px 0 0 6px}
.row{padding:6px 10px;align-items:start}
.row + .row{border-top:1px dashed var(--rule)}
.gt{font-weight:900;font-stretch:125%;font-size:13px;padding-top:4px;text-align:right;padding-right:2px}
.grp:not(.multi) .gt{font-size:18px;text-align:left;padding-left:4px}
.nm{border:0;background:none;text-align:left;padding:3px 4px 3px 2px;display:grid;align-content:start;gap:1px;min-height:48px;border-radius:8px}
.nm:active{background:var(--paper-2)}
.nm b{font-size:15px;font-weight:700;font-stretch:87.5%;line-height:1.18}
.nm .alt{font-size:13px;color:var(--ink-2);line-height:1.25;font-stretch:87.5%}
.nm .rx{font-size:13px;font-weight:700;margin-top:3px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.nm .rx svg{width:15px;height:15px;color:var(--ink-2);margin-left:2px}
.nm .up{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:800;margin-top:3px;padding:1px 6px 1px 4px;border-radius:6px;background:var(--hi);width:max-content}
.nm .up svg{width:12px;height:12px}
.cell{position:relative;border:1.5px solid var(--rule-strong);border-radius:10px;background:var(--paper);height:56px;display:grid;place-content:center;text-align:center;padding:0;transition:transform .12s ease}
.cell:active{transform:scale(.94)}
.cell .k{font-size:18px;font-weight:800;font-stretch:87.5%;line-height:1}
.cell .r{font-size:13px;color:var(--ink-2);line-height:1.2;margin-top:2px}
.cell .plus{width:16px;height:16px;color:var(--rule-strong)}
.cell.done{background:var(--hi);border-color:var(--ink)}
.cell.done .r{color:var(--ink)}
.cell .ck{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center}
.cell .ck svg{width:11px;height:11px}
.cell.next{border:2.5px solid var(--ink)}
.cell.next .plus{color:var(--ink);width:20px;height:20px}
.cell.none{height:56px;border:1.5px dashed var(--rule);background:repeating-linear-gradient(135deg,transparent 0 6px,var(--rule) 6px 7px)}
.gfoot{padding:0 12px 10px 49px;font-size:13px;color:var(--ink-2);line-height:1.35}
.gfoot b{color:var(--ink)}
.after{margin:14px 0 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:14px;border:1.5px solid var(--ink);background:var(--paper);font-weight:800;font-size:17px;transition:transform .12s ease}
.btn:active{transform:scale(.98)}
.btn svg{width:22px;height:22px}
.btn.primary{background:var(--ink);color:var(--paper)}
.help{margin-top:12px;border-top:1.5px solid var(--ink)}
.help summary,.acc summary{list-style:none;min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700;cursor:pointer}
.help summary::-webkit-details-marker,.acc summary::-webkit-details-marker{display:none}
.help summary::after,.acc summary::after{content:"";width:9px;height:9px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin:-4px 4px 0 0;flex:none}
.help[open] summary::after,.acc[open] summary::after{transform:rotate(-135deg);margin-top:4px}
.help p{font-size:15px;margin:0 0 10px}

/* ---------- Carimbo ---------- */
.stamp{border:3px solid var(--ink);border-radius:10px;padding:12px 14px 14px;margin:4px 6px 18px;transform:rotate(-1.4deg);background:color-mix(in srgb,var(--paper) 55%,transparent)}
.stamp h2{font-size:22px;font-weight:900;font-stretch:125%}
.stamp .row2{display:flex;flex-wrap:wrap;gap:6px 22px;margin:8px 0 6px}
.stamp .row2 b{display:block;font-size:26px;font-weight:900;font-stretch:112.5%;line-height:1}
.stamp .row2 span{font-size:13px;color:var(--ink-2)}
.stamp p{font-size:14px}
.stamp.new{animation:stamp .38s cubic-bezier(.2,.9,.3,1.25)}
@keyframes stamp{from{transform:scale(1.35) rotate(-7deg);opacity:0}to{transform:rotate(-1.4deg);opacity:1}}

/* ---------- Número de peito (corrida) ---------- */
.bib{position:relative;background:var(--paper);border:1.5px solid var(--ink);border-radius:16px;margin:18px 0 18px;overflow:hidden;text-align:center;padding-bottom:18px}
.bib .band{background:var(--ink);color:var(--paper);font-size:13px;font-weight:600;padding:9px 14px}
.bib .num{font-size:clamp(92px,29vw,132px);font-weight:900;font-stretch:125%;line-height:.9;margin-top:22px;letter-spacing:-.03em}
.bib .num small{font-size:20px;font-weight:800;letter-spacing:0;margin-left:4px}
.bib .nmr{font-size:19px;font-weight:800;margin-top:10px;padding:0 20px}
.bib .ds{font-size:14px;color:var(--ink-2);margin-top:4px}
.bib .hole{position:absolute;top:50px;width:13px;height:13px;border-radius:50%;background:var(--page);border:1.5px solid var(--ink)}
.bib .hole.l{left:14px}.bib .hole.r{right:14px}
.bib .hole.bl{top:auto;bottom:14px;left:14px}.bib .hole.br{top:auto;bottom:14px;right:14px}
.bib .done{display:inline-block;margin-top:14px;border:2.5px solid var(--ink);border-radius:8px;padding:6px 12px;font-weight:800;transform:rotate(-2deg)}

/* ---------- Seções de texto ---------- */
.blk{padding:18px 0 4px;border-top:1.5px solid var(--ink)}
.blk:first-child{border-top:0}
.blk h2{font-size:21px;font-weight:800;font-stretch:112.5%;margin-bottom:6px}
.blk p{font-size:16px;line-height:1.5}
.blk p + p{margin-top:8px}
.steps{list-style:none;margin:8px 0 6px;padding:0;counter-reset:st}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--rule)}
.steps li:first-child{border-top:0}
.steps li::before{counter-increment:st;content:counter(st);width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:14px}
.steps b{display:block}
.steps .pc{font-size:14px;color:var(--ink-2)}
ul.pl{margin:6px 0 8px;padding-left:20px}
ul.pl li{margin:5px 0}
.form{background:var(--paper);border:1.5px solid var(--ink);border-radius:16px;padding:14px;margin:8px 0 16px}
.form h2{font-size:21px;font-weight:800;font-stretch:112.5%;margin-bottom:10px}
.f3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fl{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--ink-2)}
.in{width:100%;min-height:52px;border:1.5px solid var(--rule-strong);border-radius:12px;background:var(--paper);padding:8px 12px;font-size:17px;color:var(--ink)}
.in.big{font-size:24px;font-weight:800;font-stretch:112.5%}
.in:focus{border-color:var(--ink)}
.pace{margin-top:12px;font-size:22px;font-weight:900;font-stretch:112.5%}
.fnote{font-size:13px;color:var(--ink-2);margin-top:6px}

/* ---------- Páginas de consulta ---------- */
.ph{padding:14px 0 14px;border-bottom:3px solid var(--ink)}
.ph h1{font-size:clamp(38px,11vw,48px);font-weight:900;font-stretch:125%;line-height:1;letter-spacing:-.02em}
.ph p{color:var(--ink-2);margin-top:8px;font-size:15px}
.phrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.iconbtn{flex:none;width:48px;height:48px;border:1.5px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);display:grid;place-items:center;padding:0}
.iconbtn svg{width:24px;height:24px}
.sub3{font-size:16px;margin-top:22px}
.sec{background:var(--paper);border:1.5px solid var(--ink);border-radius:16px;padding:16px 16px 14px;margin-top:14px}
.sec h2{font-size:20px;font-weight:800;font-stretch:112.5%;margin-bottom:10px}
.sec > p{font-size:16px}
.sec > p + p{margin-top:8px}
.sec .sub{color:var(--ink-2);font-size:14px;margin:-4px 0 8px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:4px 0 8px}
table.t{width:100%;border-collapse:collapse;font-size:15px}
.t th{font-size:12px;font-weight:700;color:var(--ink-2);text-align:left;padding:8px 10px 6px 0;border-bottom:1.5px solid var(--ink);white-space:nowrap}
.t td{padding:10px 10px 10px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.t td.n,.t th.n{text-align:right;white-space:nowrap;padding-right:0}
.t td.b{font-weight:700}
.t tr.now td{background:var(--fR)}
.t tr.now td:first-child{box-shadow:inset 4px 0 0 var(--ink);padding-left:10px}
.t tr.tot td{font-weight:800;border-bottom:0;border-top:1.5px solid var(--ink)}
.t .s{display:block;font-size:13px;color:var(--ink-2)}
.big3{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--ink);border-radius:14px;overflow:hidden;margin:4px 0 12px}
.big3 div{padding:10px 10px 12px}
.big3 div + div{border-left:1.5px solid var(--ink)}
.big3 b{display:block;font-size:22px;font-weight:900;font-stretch:112.5%;line-height:1.1}
.big3 span{font-size:13px;color:var(--ink-2)}
.goal{border-left:5px solid var(--ink);padding:4px 0 4px 12px;margin:12px 0 4px;font-size:16px}
.acc{border-top:1px solid var(--rule)}
.acc:last-of-type{border-bottom:1px solid var(--rule)}
.acc summary{padding:6px 0}
.acc summary span b{display:block;font-size:17px}
.acc summary span small{display:block;font-size:13px;color:var(--ink-2);font-weight:500}
.acc .body{padding:0 0 14px}
.acc .body h3{font-size:14px;font-weight:800;margin-top:8px}
.acc .body p{font-size:15px}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.trend{margin-top:8px;font-size:15px}
.trend b.v{font-size:26px;font-weight:900;font-stretch:112.5%;margin-right:6px}
.del{border:0;background:none;width:44px;height:44px;display:grid;place-items:center;margin:-12px -10px -12px 0;color:var(--ink-2)}
.del svg{width:18px;height:18px}
.row-actions{display:flex;gap:8px;margin-top:10px}
.row-actions .btn{min-height:48px;font-size:15px}
textarea.in{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:12px}

/* ---------- Barra inferior ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar);color:var(--bar-ink);padding-bottom:env(safe-area-inset-bottom,0px)}
body.typing .dock{display:none}
.rest{position:relative;background:var(--paper);color:var(--ink);border-top:1.5px solid var(--ink);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;overflow:hidden}
.rest[hidden]{display:none}
.rest .fill{position:absolute;left:0;top:0;bottom:0;background:var(--hi);transform-origin:left;z-index:0}
.rest > *:not(.fill){position:relative;z-index:1}
.rest .rl{font-size:13px;font-weight:600;line-height:1.2}
.rest .rt{font-size:30px;font-weight:900;font-stretch:125%;line-height:1.05}
.rest > div:not(.rb){min-width:0}
.rest .rb{display:flex;gap:6px;flex:none}
.rest .rb button{min-height:44px;border-radius:22px;border:1.5px solid var(--ink);background:var(--paper);padding:0 14px;font-weight:800;font-size:14px;white-space:nowrap}
.nav{display:grid;grid-template-columns:repeat(4,1fr);max-width:560px;margin:0 auto;padding:6px 8px 4px}
.nav button{transition:background-color .35s ease,opacity .2s ease;border:0;background:none;color:var(--bar-ink);display:grid;justify-items:center;gap:2px;min-height:54px;padding:4px 0;font-size:12px;font-weight:700;opacity:.72;border-radius:14px}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{opacity:1;background:var(--navc);color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nav button[aria-current="page"]{color:var(--ink)}}

/* ---------- Gaveta ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s ease}
.scrim.on{opacity:1;pointer-events:auto}
.bs{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--paper);border:1.5px solid var(--ink);border-bottom:0;border-radius:22px 22px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow-y:auto;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.bs.on{transform:none;visibility:visible}
.grab{width:42px;height:5px;border-radius:3px;background:var(--rule-strong);margin:2px auto 10px}
.bsh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.bsh h2{font-size:22px;font-weight:900;font-stretch:112.5%;line-height:1.1;padding-top:4px}
.bsh .ib{margin:-2px -10px 0 0}
.bs .sub{font-size:14px;color:var(--ink-2);margin-top:4px}
.bs .hint{font-size:14px;margin:12px 0 4px;padding:10px 12px;border-radius:12px;background:var(--paper-2)}
.bs .hint.up{background:var(--hi)}
.stp{margin-top:14px}
.stp .lb{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.stp .ctl{display:grid;grid-template-columns:68px 1fr 68px;gap:10px;align-items:center}
.stp .ctl button{height:64px;border-radius:16px;border:1.5px solid var(--ink);background:var(--paper);display:grid;place-items:center;transition:transform .1s ease}
.stp .ctl button:active{transform:scale(.94);background:var(--paper-2)}
.stp .ctl button svg{width:26px;height:26px}
.stp input{width:100%;min-height:64px;text-align:center;font-size:44px;font-weight:900;font-stretch:112.5%;border:0;border-bottom:2px solid var(--rule-strong);background:none;border-radius:0;padding:0}
.stp input:focus{outline:none;border-bottom-color:var(--ink)}
.err{color:var(--ink);font-size:14px;font-weight:700;margin-top:6px;display:flex;gap:6px;align-items:center}
.bs .acts{display:grid;gap:8px;margin-top:18px}
.bs .info p{font-size:15px;margin-top:10px}
.bs .facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:12px;font-size:15px}
.bs .facts dt{color:var(--ink-2);font-size:14px}
.bs .facts dd{margin:0;font-weight:700}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--paper);border-radius:14px;padding:12px 16px;font-size:14px;font-weight:600;max-width:92vw;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.toast.act{pointer-events:auto}
.toast button{border:0;background:none;color:var(--paper);font-weight:800;text-decoration:underline;min-height:44px;padding:0 4px}
/* ---------- Mudar data e trocar treino ---------- */
.swl{display:grid;gap:6px;margin-top:14px}
.swl button{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;text-align:left;border:1.5px solid var(--rule-strong);border-radius:14px;background:var(--paper);padding:8px 10px;min-height:60px}
.swl button[aria-pressed="true"]{border:2.5px solid var(--ink);padding:7px 9px}
.swl .chip{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--ink);background:var(--c);display:grid;place-items:center;font-weight:900;font-stretch:112.5%;font-size:15px}
.swl b{display:block;font-size:16px}.swl small{display:block;font-size:13px;color:var(--ink-2)}
/* ---------- Cronômetro, variação e progresso ---------- */
.start{display:grid;gap:4px;margin:0 0 16px}
.start .btn svg{width:18px;height:18px}
.live{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin:0 0 16px;font-size:15px;font-weight:600}
.live .dot{width:10px;height:10px;border-radius:50%;background:var(--ink);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.cell .av{position:absolute;top:-6px;left:-6px;width:18px;height:18px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink);font-size:12px;font-weight:800;line-height:1;display:grid;place-items:center}
.cell.done.alt{border-style:dashed;border-width:2px}
.vt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.vt button{min-height:60px;border-radius:14px;border:1.5px solid var(--rule-strong);background:var(--paper);padding:8px 10px;text-align:left;font-weight:700;font-size:14px;line-height:1.2;display:grid;align-content:center;gap:3px}
.vt button small{font-size:12px;font-weight:600;color:var(--ink-2)}
.vt button[aria-pressed="true"]{border:2.5px solid var(--ink);background:var(--hi);padding:7px 9px}
.vt button[aria-pressed="true"] small{color:var(--ink)}
.sw{border:1.5px solid var(--ink);border-radius:14px;padding:14px 12px 10px;margin:0 0 14px;text-align:center}
.swt{font-size:48px;font-weight:900;font-stretch:125%;line-height:1;font-variant-numeric:tabular-nums}
.sw .row-actions{justify-content:center;margin-top:0}
.sw .btn svg{width:18px;height:18px}
.seg.three{grid-template-columns:repeat(3,1fr);margin-top:16px}
.seg.three button + button{border-left:1.5px solid var(--ink)}
.sec .mnav{margin-bottom:4px}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.mnav h2{margin:0!important}
.cal{margin:12px 0 6px}
.cal .hd,.cal .gd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .hd span{text-align:center;font-size:12px;font-weight:700;color:var(--ink-2);padding-bottom:4px}
.cd{position:relative;aspect-ratio:1;min-height:44px;border-radius:10px;border:1.5px solid var(--rule);background:var(--c);padding:4px 0 2px;display:grid;grid-template-rows:auto 1fr;justify-items:center;align-items:center;color:var(--ink)}
.cd .n{font-size:12px;font-weight:600;line-height:1;color:var(--ink-2)}
.cd .g{font-size:16px;font-weight:900;font-stretch:112.5%;line-height:1}
.cd.done{border-color:var(--ink)}
.cd.done .n{color:var(--ink)}
.cd.miss{border:1.5px dashed var(--rule-strong);background:none}
.cd.fut{background:none}
.cd.miss .g,.cd.fut .g{color:var(--ink-2);font-weight:700}
.cd.today{border:2.5px solid var(--ink)}
.cd.out{visibility:hidden}
.cw{position:relative;margin:6px 0 8px;border-radius:8px;outline-offset:4px}
.cw svg{width:100%;height:auto;display:block;touch-action:pan-y;overflow:visible}
.cw .b{transition:opacity .15s ease}
.cw .b.dim{opacity:.35}
.tt{position:absolute;left:0;top:0;z-index:3;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);border-radius:10px;padding:6px 10px;font-size:13px;line-height:1.4;pointer-events:none;white-space:nowrap}
.tt .tk{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:-1px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--ink-2);margin:0 0 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lk{position:relative;display:inline-block;width:20px;height:2px;background:var(--c)}
.lk::after{content:"";position:absolute;left:5px;top:-4px;width:10px;height:10px;background:var(--c);border-radius:50%}
.lk.sq::after{border-radius:2px}
.hist{list-style:none;margin:0;padding:0}
.hist li + li{border-top:1px solid var(--rule)}
.hist button{width:100%;border:0;background:none;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;text-align:left;min-height:60px}
.hist .chip{width:42px;height:42px;border-radius:10px;border:1.5px solid var(--ink);background:var(--c);display:grid;place-items:center;font-weight:900;font-stretch:112.5%;font-size:15px}
.hist b{display:block;font-size:16px;line-height:1.25}
.hist small{display:block;font-size:13px;color:var(--ink-2);font-weight:500}
.hist .v{text-align:right;font-size:14px;font-weight:700;white-space:nowrap}
.empty{padding:14px 16px;border:1.5px dashed var(--rule-strong);border-radius:14px;color:var(--ink-2);font-size:15px;margin:6px 0}
.check{display:flex;align-items:center;gap:12px;min-height:48px;font-size:16px;font-weight:600;color:var(--ink)}
.check input{width:24px;height:24px;accent-color:var(--ink)}
select.in{font-weight:700;appearance:auto}
.t td .lnk{border:0;background:none;padding:0;min-height:44px;font-weight:700;text-decoration:underline;text-underline-offset:3px;color:var(--ink)}
@media (max-width:360px){.thead,.row{grid-template-columns:30px minmax(0,1fr) repeat(var(--n),48px);column-gap:4px}.gfoot{padding-left:44px}}

/* ---------- Páginas de consulta: mesma linguagem da Ficha ---------- */
.pgtop{display:flex;align-items:center;gap:8px;min-height:48px}
.pgtop .wl{font-weight:800;font-size:17px;font-stretch:112.5%;flex:1}
.tabs.pg{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--page);transition:background-color .35s ease;padding-top:6px;margin-top:0}
.tab.pg{cursor:pointer;gap:3px;padding:7px 2px 6px;transition:background-color .35s ease,transform .1s ease}
.tab.pg:active{transform:translateY(1px)}
.tab.pg svg{width:22px;height:22px}
.tab.pg .d{font-size:13px;font-weight:700}
.tab.pg[aria-pressed="true"] .d{font-weight:900}
.more{color:var(--ink-2);display:grid;place-items:center}
.more svg{width:18px;height:18px}
.h3s{font-size:14px;font-weight:800;margin:14px 0 4px}
.bs .info .h3s:first-child{margin-top:0}
.bs .info ol.steps{margin:4px 0}
.bs .info ul.pl{margin:4px 0 0}
.bs .acts .btn{min-height:52px;font-size:16px}

/* blocos tocáveis */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles.flat{margin-top:14px}
.tiles.flat .tile{min-height:112px;padding:14px}
.tile{border:1.5px solid var(--ink);border-radius:14px;background:var(--paper);padding:12px;text-align:left;display:grid;gap:3px;align-content:start;min-height:84px;transition:transform .12s ease,background-color .15s ease}
.tile:active{transform:scale(.97);background:var(--hi)}
.tile svg{width:26px;height:26px;margin-bottom:4px}
.tile b{font-size:16px;line-height:1.2}
.tile small{font-size:13px;color:var(--ink-2);line-height:1.25}
.rowl{list-style:none;margin:0;padding:0}
.rowl li + li{border-top:1px dashed var(--rule-strong)}
.rowl button{width:100%;border:0;background:none;display:grid;grid-template-columns:38px minmax(0,1fr) 20px;gap:12px;align-items:center;min-height:60px;padding:8px 0;text-align:left;border-radius:10px}
.rowl button:active{background:var(--paper-2)}
.rowl .ic{width:38px;height:38px;border-radius:11px;border:1.5px solid var(--ink);background:var(--hi);display:grid;place-items:center}
.rowl .ic svg{width:20px;height:20px}
.rowl b{display:block;font-size:16px;line-height:1.2}
.rowl small{display:block;font-size:13px;color:var(--ink-2);line-height:1.25}

/* corrida: número de peito, cronômetro de pulso, régua de ritmos, plano */
.lcds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lcds div{background:var(--ink);color:var(--paper);border-radius:12px;padding:9px 8px 10px;text-align:center;box-shadow:inset 0 -3px 0 rgba(255,255,255,.08)}
.lcds small{display:block;font-size:12px;font-weight:700;opacity:.75}
.lcds b{display:block;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.25;margin-top:2px}
.lcds span{font-size:12px;opacity:.75}
.zwrap{position:relative;padding-top:22px}
.ticks{position:absolute;left:102px;right:84px;top:0;bottom:0;pointer-events:none}
.ticks i{position:absolute;top:0;bottom:0;border-left:1.5px dotted var(--ink-2)}
.ticks i b{position:absolute;top:0;left:3px;font-size:11px;font-style:normal;font-weight:700;color:var(--ink-2);white-space:nowrap;transform:translateY(-1px)}
.zn{position:relative;z-index:1;display:grid;grid-template-columns:92px minmax(0,1fr) 74px;gap:10px;align-items:center;width:100%;border:0;background:none;min-height:50px;padding:0;text-align:left}
.zn:active .trk{background:var(--rule)}
.zn .zname{font-weight:800;font-size:15px}
.zn .trk{position:relative;height:30px;border-radius:8px;background:var(--paper-2);transition:background-color .15s ease}
.zn .bar{position:absolute;top:3px;bottom:3px;min-width:10px;border:1.5px solid var(--ink);border-radius:6px;background:var(--hi);transform-origin:left;animation:grow .55s cubic-bezier(.2,.8,.2,1) both}
.zn .tn{position:absolute;inset:0;display:grid;align-items:center;padding-left:8px;font-size:12px;color:var(--ink-2)}
.zcap{position:absolute;left:0;top:2px;font-size:11px;font-weight:700;color:var(--ink-2)}
.zn .pc2{font-size:13px;font-weight:700;text-align:right;white-space:nowrap}
.pl3 .hd,.wkr{display:grid;grid-template-columns:30px minmax(0,1fr) 54px 18px;gap:8px;align-items:center}
.pl3 .hd{font-size:12px;font-weight:700;color:var(--ink-2);padding:0 8px 6px;border-bottom:1.5px solid var(--ink)}
.pl3 .hd span:nth-child(3){text-align:right}
.phb{margin:14px 0 2px;padding:6px 10px;border-radius:8px;background:var(--hi);border:1.5px solid var(--ink);display:flex;justify-content:space-between;gap:8px;font-size:13px}
.phb b{font-weight:800}
.wkr{width:100%;border:0;border-bottom:1px solid var(--rule);background:none;text-align:left;min-height:52px;padding:6px 8px;border-radius:0}
.wkr:active{background:var(--paper-2)}
.wkr .wn{font-weight:900;font-stretch:125%;font-size:18px}
.wkr .wq{font-size:15px;line-height:1.2;font-weight:600}
.wkr .wq i{display:inline-block;margin-left:6px;font-style:normal;font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px;background:var(--paper-2);border:1px solid var(--rule-strong)}
.wkr .wl2{text-align:right;font-weight:800;font-size:15px;white-space:nowrap}
.wkr.now{background:var(--hi);box-shadow:inset 0 0 0 1.5px var(--ink);border-radius:10px;border-bottom-color:transparent}

/* comida: tabela nutricional de embalagem e cupom de cardápio */
.nutri{background:var(--paper);border:2px solid var(--ink);padding:10px 12px 12px;margin-top:14px}
.nutri h2{font-size:26px;font-weight:900;font-stretch:75%;text-transform:uppercase;letter-spacing:.01em;line-height:1;margin:0}
.nutri .por{font-size:13px;padding:4px 0 6px}
.nutri .b8{height:8px;background:var(--ink)}
.nutri .b4{height:4px;background:var(--ink)}
.nutri .nh{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:700;padding:4px 0 3px}
.nrow{display:grid;grid-template-columns:minmax(0,1fr) auto 3.2em;gap:0 10px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--ink);font-size:15px}
.nrow:last-of-type{border-bottom:0}
.nrow .l{overflow-wrap:anywhere}
.nrow .v{text-align:right;white-space:nowrap;font-weight:800}
.nrow .p{text-align:right;font-weight:700}
.nrow.cal{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 10px;border-bottom:0;padding:8px 0 6px}
.nrow.cal .l{font-size:17px;font-weight:900}
.nrow.cal .v{margin-left:auto;font-size:22px;font-weight:900}
.nrow.cal .v i{font-style:normal;font-size:15px}
.nutri h2{overflow-wrap:anywhere}
.nutri .ft{font-size:12px;line-height:1.35;padding-top:7px}
.nutri .ft button{display:block;margin-top:6px;border:0;background:none;padding:0;min-height:44px;font-weight:800;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.receipt{position:relative;background:var(--paper);padding:14px 14px 18px;margin:22px 4px 24px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;filter:drop-shadow(0 0 .8px var(--ink)) drop-shadow(0 3px 0 color-mix(in srgb,var(--ink) 14%,transparent))}
.receipt::before,.receipt::after{content:"";position:absolute;left:0;right:0;height:9px;background:radial-gradient(circle at 50% 0,transparent 5.5px,var(--paper) 6px) 50% 0/14px 9px repeat-x}
/* os recortes entram a partir da borda de fora: em cima o gradiente já nasce na borda; embaixo ele é virado */
.receipt::before{bottom:100%}
.receipt::after{top:100%;transform:scaleY(-1)}
.receipt .rh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:8px;border-bottom:2px dashed var(--ink-2)}
.receipt .rh b{font-size:18px;letter-spacing:.12em}
.receipt .rh span{font-size:12px;color:var(--ink-2)}
.receipt ul{list-style:none;margin:0;padding:0}
.receipt li button{width:100%;border:0;background:none;display:grid;grid-template-columns:46px minmax(0,1fr);align-items:start;min-height:62px;padding:9px 0 7px;text-align:left;font-family:inherit;font-size:15px;border-radius:6px}
.receipt li button:active{background:var(--paper-2)}
.receipt .tm{padding-top:2px;font-size:13px;color:var(--ink-2)}
.receipt .nmx{flex:none;font-weight:700}
.receipt .dots{flex:1;min-width:12px;border-bottom:2px dotted var(--ink-2);margin:0 6px;transform:translateY(5px)}
.receipt .kc{font-weight:800;flex:none}
.receipt .r1{display:flex;align-items:center;min-height:24px}
.receipt .r2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--ink-2);margin-top:1px}
.receipt .r2 .on{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.receipt .r2 .mm{flex:none;color:var(--ink);font-weight:700;letter-spacing:-.02em}
.receipt .rt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:800;font-size:16px;padding-top:9px;margin-top:2px;border-top:2px dashed var(--ink-2)}
.receipt .rst{text-align:right;font-size:12px;color:var(--ink-2);margin:1px 0 7px}
.receipt .rg{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:3px 10px;align-items:baseline;font-size:14px}
.receipt .rm{display:contents}
.receipt .rm .l{font-weight:800}
.receipt .rm b{text-align:right;white-space:nowrap}
.receipt .rm .st{text-align:right;white-space:nowrap;font-size:12px;color:var(--ink-2)}
.receipt .barcode{height:30px;margin-top:16px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 13px,var(--ink) 13px 14px,transparent 14px 18px)}
.fcap{margin:-6px 6px 14px}
button.fcap{display:block}
.legend2{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink-2);margin-top:8px;align-items:center}
.legend2 span{display:inline-flex;align-items:center;gap:6px}
.lg{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--ink);background:var(--hi)}
.lg.dash{border-style:dashed;border-color:var(--rule-strong);background:none}
.msr .zn{grid-template-columns:112px minmax(0,1fr) 54px;min-height:44px}
.zn .bar.x{background:repeating-linear-gradient(135deg,transparent 0 4px,var(--hi) 4px 6px);border-style:dashed}

/* comida: macros em tinta (proteína cheia, carboidrato listrado, gordura pontilhada), balança e busca */
.mxbar{display:flex;height:12px;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--paper)}
.mxbar i{display:block;min-width:0}
.mxbar i + i{border-left:1.5px solid var(--ink)}
.mp{background:var(--ink)}
.mc{background:repeating-linear-gradient(135deg,var(--ink) 0 1.5px,transparent 1.5px 4.5px)}
.mg{background:radial-gradient(circle at 2.25px 2.25px,var(--ink) 1.15px,transparent 1.6px) 0 0/4.5px 4.5px}
.msw{display:inline-block;width:12px;height:12px;border:1.5px solid var(--ink);border-radius:3px;vertical-align:-1px;margin-right:5px}
.mxl{display:flex;flex-wrap:wrap;gap:0 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.mxl b{font-weight:900;color:var(--ink)}
.mxk{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;font-weight:600;margin-top:6px}
.mxw{padding:2px 0 0}
.nutri .mxh{padding-top:8px}
.nrow.cal.g{display:grid;grid-template-columns:minmax(0,1fr) auto 3.2em;gap:0 10px;align-items:baseline}
.nrow.cal.g .l{line-height:1.1}
.nrow.cal .p{text-align:right;font-weight:700}
.nutri.sm{margin-top:14px}
.nutri.sm h2{font-size:22px}
.f2 .in,.f3 .in{min-width:0}

/* gaveta: alimentos de uma refeição e trocas */
.opts button{grid-template-columns:44px minmax(0,1fr)}
.its{list-style:none;margin:2px 0 0;padding:0}
.its li + li{border-top:1px dashed var(--rule-strong)}
.it{width:100%;border:0;background:none;display:grid;grid-template-columns:minmax(0,1fr) 22px;gap:0 8px;align-items:center;text-align:left;padding:10px 0;min-height:64px;border-radius:10px}
.it:active{background:var(--paper-2)}
.it .ix{display:grid;gap:2px;min-width:0}
.it b{font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.it .qt{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--ink-2)}
.it .kc2{flex:none;font-weight:800;color:var(--ink)}
.tgs{display:flex;flex-wrap:wrap;gap:4px}
.tg{display:inline-block;border:1.5px solid var(--ink);border-radius:6px;padding:0 6px;font-size:11px;font-weight:800;line-height:1.45;text-transform:uppercase;letter-spacing:.03em}
.tg.inv{background:var(--ink);color:var(--paper)}

/* balança: a quantidade num mostrador, com medidas caseiras ao lado */
.scale{margin-top:14px}
.scale .lb{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:6px;min-height:18px}
.scale .lb span{color:var(--ink)}
.scale .ctl{display:grid;grid-template-columns:64px minmax(0,1fr) 64px;gap:10px;align-items:center}
.scale .ctl button{height:64px;border-radius:16px;border:1.5px solid var(--ink);background:var(--paper);display:grid;place-items:center;transition:transform .1s ease}
.scale .ctl button:active{transform:scale(.94);background:var(--paper-2)}
.scale .ctl button svg{width:26px;height:26px}
.lcd{display:flex;align-items:baseline;justify-content:flex-end;gap:6px;height:64px;padding:0 14px;background:var(--ink);color:var(--paper);border-radius:12px;box-shadow:inset 0 -3px 0 rgba(255,255,255,.08);cursor:text;min-width:0}
.lcd input{min-width:0;width:100%;align-self:center;text-align:right;background:none;border:0;color:inherit;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:34px;font-weight:800;letter-spacing:-.03em;padding:0}
.lcd input:focus{outline:none}
.lcd:focus-within{outline:3px solid var(--ink);outline-offset:2px}
.lcd span{align-self:center;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:16px;font-weight:700;opacity:.75}
.pchs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pch{border:1.5px solid var(--ink);border-radius:999px;background:var(--paper);min-height:44px;padding:4px 12px;font-weight:700;font-size:14px;line-height:1.15;display:inline-flex;align-items:baseline;gap:6px}
.pch small{font-size:12px;font-weight:600;color:var(--ink-2)}
.pch:active{background:var(--paper-2)}
.pch[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.pch[aria-pressed="true"] small{color:var(--paper);opacity:.8}

/* buscar */
.srch{display:flex;align-items:center;gap:10px;border:2px solid var(--ink);border-radius:14px;background:var(--paper);padding:0 6px 0 14px;min-height:56px}
.srch svg{width:22px;height:22px}
.srch input{flex:1;min-width:0;border:0;background:none;font-size:17px;font-weight:600;padding:12px 0;appearance:none;-webkit-appearance:none}
.srch input::placeholder{color:var(--ink-2);font-weight:500}
.srch input:focus{outline:none}
.srch:focus-within{box-shadow:inset 0 0 0 1px var(--ink)}
.srch input::-webkit-search-cancel-button{display:none}
.srch .clr{display:none;width:44px;height:44px;border:0;background:none;place-items:center;padding:0;border-radius:50%}
.srch.has .clr{display:grid}
.srch .clr svg{width:20px;height:20px}
.fgs{display:flex;gap:6px;margin:12px -16px 0;padding:3px 16px 5px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.fgs::-webkit-scrollbar{display:none}
.fgs button{flex:none;position:relative;border:1.5px solid var(--ink);border-radius:999px;background:var(--paper);min-height:40px;padding:0 14px;font-weight:700;font-size:14px;white-space:nowrap}
.fgs button::after{content:"";position:absolute;inset:-4px -2px}
.fgs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.fopt{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:8px;margin-top:12px;align-items:center}
.fopt .seg{margin:0}
.fopt .seg button{min-height:46px;font-size:14px;padding:0 4px}
.fopt .in{min-height:48px;font-size:16px;padding:6px 8px}
.flist{list-style:none;margin:0;padding:0}
.flist li + li{border-top:1px dashed var(--rule-strong)}
.fr{width:100%;border:0;background:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;align-items:center;text-align:left;padding:11px 0 12px;min-height:72px;border-radius:10px}
.fr:active{background:var(--paper-2)}
.fr .mxl{grid-column:1/-1}
.fr .mxbar{grid-column:1/-1;height:9px;margin-top:2px}
.fr .fn b{display:block;font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.fr .fn small{display:block;font-size:13px;color:var(--ink-2)}
.fr .fk{text-align:right}
.fr .fk b{display:block;font-size:20px;font-weight:900;font-stretch:112.5%;line-height:1.05}
.fr .fk small{font-size:12px;color:var(--ink-2)}
.fr i.own{display:inline-block;margin-left:6px;font-style:normal;font-size:11px;font-weight:800;padding:0 6px;border-radius:6px;background:var(--hi);border:1px solid var(--ink);vertical-align:2px}

/* movimento: a página entra, a aba troca, nada pisca */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#view.enter.pg>*{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
#view.enter.pg>*:nth-child(2){animation-delay:.04s}
#view.enter.pg>*:nth-child(3){animation-delay:.08s}
#view.enter.pg>*:nth-child(4){animation-delay:.12s}
#view.enter.pg>*:nth-child(5){animation-delay:.16s}
#view.enter.pg>*:nth-child(n+6){animation-delay:.2s}
#view.enter.sub>*:nth-child(n+3){animation:slideL .32s cubic-bezier(.2,.8,.2,1) both}
#view.enter.sub.dr>*:nth-child(n+3){animation-name:slideR}
#view.enter.sub>*:nth-child(4){animation-delay:.05s}
#view.enter.sub>*:nth-child(n+5){animation-delay:.09s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>

function applyRemote(res,first){

    const e=res.days[d], m=sy.days[d];

      if(store.activeDate===d)store.activeDate=null;if(store.runDate===d)store.runDate=null;

      sy.wts[d]={fp:'',v:e.v,del:true,dirty:false};return;
    }

    if(!m&&local){if(hashStr(JSON.stringify(canonW(local)))===fp)sy.wts[d]={fp:fp,v:e.v,del:false,dirty:false};return}

function commitSet(id,i,val){

  if(!s.sets[id])s.sets[id]=[]; while(s.sets[id].length<=i)s.sets[id].push({kg:'',reps:'',done:false});
  s.sets[id][i]=val;
  if(val.done&&sel===TODAY&&!s.startedAt&&!s.finishedAt){s.startedAt=Date.now();store.activeDate=sel;unlockAudio()}
  touch(); save(); closeBS();
  if(val.done){try{navigator.vibrate&&navigator.vibrate(14)}catch(e){}}
  const y=window.scrollY; render(); window.scrollTo(0,y);
  if(val.done){
    const b=F.block, blocks=S[F.key].blocks, bi=blocks.indexOf(b), rounds=Math.max.apply(null,b.ex.map(function(e){return setsFor(e,deload)}));
    const roundDone=b.ex.every(function(ex){if(setsFor(ex,deload)<=i)return true;const a=s.sets[ex.id]||[];return a[i]&&a[i].done});

    else if(roundDone&&a&&a.d===sel){

    if(c){const r=c.getBoundingClientRect();if(r.top<60||r.bottom>window.innerHeight-160)setTimeout(function(){c.scrollIntoView({block:'center',behavior:RM()?'auto':'smooth'})},150)}
  }
}

const EQK={pro:'p',car:'c',fru:'c',lat:'k',gor:'f',veg:'k',beb:'k',doc:'k'};

function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function mkFood(r){
  return {id:r[0],n:r[1],gr:r[2],k:r[3],p:r[4],c:r[5],f:r[6],u:r[7],a:r[9]||'',sub:r[10]||'',own:false,
    m:r[8].map(function(x){return {s:x[0],p:x[1],g:x[2],st:x[3]||(x[2]>=90?0.5:1)}}),_s:norm(r[1]+' '+(r[9]||''))};
}
function mkOwn(o){
  return {id:o.id,n:o.n,gr:FG[o.gr]?o.gr:'doc',k:+o.k||0,p:+o.p||0,c:+o.c||0,f:+o.f||0,u:o.u==='ml'?'ml':'g',a:'',sub:'',own:true,
    m:[{s:'porção',p:'porções',g:+o.por>0?+o.por:100,st:1}],_s:norm(o.n)};
}
function rebuildFoods(){

  myFoods.forEach(function(o){if(o&&/^u[a-z0-9]+$/.test(o.id)&&o.n)FOOD[o.id]=mkOwn(o)});
  FLIST=Object.keys(FOOD).map(function(k){return FOOD[k]});
}

/* contas: tudo vem dos valores por 100 g */
const N0={k:0,p:0,c:0,f:0};
function nutOf(f,g){const r=g/100;return {k:f.k*r,p:f.p*r,c:f.c*r,f:f.f*r}}
function addN(a,b){return {k:a.k+b.k,p:a.p+b.p,c:a.c+b.c,f:a.f+b.f}}
function sumN(items){return items.reduce(function(a,x){return addN(a,nutOf(x.f,x.g))},N0)}
function K(n){return Math.round(n).toLocaleString('pt-BR')}
function fq(n){return fN(n>=10?Math.round(n):Math.round(n*10)/10)}
function fv(n){return String(Math.round(n*10)/10).replace('.',',')}
function stepG(f){const m=f.m[0];return m.g*m.st}
function snapG(f,g){const u=stepG(f);return Math.max(u,Math.round(g/u)*u)}
/* "2 ovos" quando a quantidade fecha numa medida caseira; sempre o peso ao lado */
function qtyTxt(f,g){
  let meas='';
  for(let i=0;i<f.m.length&&!meas;i++){
    const m=f.m[i], n=g/m.g, h=Math.round(n*2)/2;
    if(h>=0.5&&h<=40&&Math.abs(n-h)<0.03&&(h%1===0||m.st<1))meas=fN(h)+' '+(h>1?m.p:m.s);
  }
  const amt=fq(g)+' '+f.u;
  return {meas:meas,amt:amt,txt:meas?meas+' · '+amt:amt};
}
/* gráficos e números em tinta: proteína cheia, carboidrato listrado, gordura pontilhada */
function mxl(n){return '<span class="mxl"><span><b>P</b> '+fq(n.p)+'</span><span><b>C</b> '+fq(n.c)+'</span><span><b>G</b> '+fq(n.f)+'</span></span>'}
function kcalShare(n){const e=[n.p*4,n.c*4,n.f*9],t=e[0]+e[1]+e[2];return t>0?e.map(function(v){return Math.round(v/t*100)}):[0,0,0]}
function mxBar(n){
  const e=[n.p*4,n.c*4,n.f*9], t=e[0]+e[1]+e[2];
  return '<span class="mxbar" aria-hidden="true">'+(t>0?['mp','mc','mg'].map(function(c,i){return e[i]>0?'<i class="'+c+'" style="flex:'+(e[i]/t*100).toFixed(1)+' 1 0"></i>':''}).join(''):'')+'</span>';
}
function mxLegend(n){
  const s=kcalShare(n);
  return '<p class="mxk"><span><i class="msw mp"></i>Proteína '+s[0]+'%</span><span><i class="msw mc"></i>Carboidrato '+s[1]+'%</span><span><i class="msw mg"></i>Gordura '+s[2]+'%</span></p>';
}
function goalPct(v,k){const g=FGOAL[k];return Math.round(v/((g[0]+g[1])/2)*100)+'%'}
function labelHtml(n,por){
  const R=function(l,v,k){return '<div class="nrow"><span class="l">'+l+'</span><b class="v">'+fq(v)+' g</b><span class="p">'+goalPct(v,k)+'</span></div>'};
  return '<h2>Informação nutricional</h2><p class="por">'+por+'</p><div class="b8"></div>'
   +'<div class="nh"><span>Quantidade</span><span>% da meta do dia</span></div>'
   +'<div class="nrow cal g"><span class="l">Valor energético</span><b class="v">'+K(n.k)+' <i>kcal</i></b><span class="p">'+goalPct(n.k,'k')+'</span></div><div class="b4"></div>'
   +R('Carboidratos',n.c,'c')+R('Proteínas',n.p,'p')+R('Gorduras totais',n.f,'f')
   +'<div class="b8"></div><p class="nh mxh"><span>De onde vêm as calorias</span></p><div class="mxw">'+mxBar(n)+mxLegend(n)+'</div>';
}

/* o dia: cada refeição tem opções; dá para trocar um alimento por outro do mesmo grupo */
let foodSel={}, foodQ='', foodG='', foodB='p', foodO='az', foodShow=FPAGE, foodDirty=false;
function selOf(mi){
  const m=MEALS[mi]; let s=foodSel[m.id];
  if(!s||typeof s!=='object')s=foodSel[m.id]={o:0,x:{}};
  if(!(s.o>=0&&s.o<m.o.length))s.o=0;
  if(!s.x||typeof s.x!=='object')s.x={};
  return s;
}
function mealItems(mi,oi){
  const m=MEALS[mi], s=selOf(mi), x=oi===s.o?s.x:{};
  return m.o[oi].i.map(function(r,idx){
    const o=x[idx], f0=FOOD[r[0]], f1=o&&FOOD[o[0]], g1=o?num(o[1]):NaN;
    if(f1&&g1>0)return {f:f1,g:g1,idx:idx,from:f0,g0:r[1],sw:f1.id!==r[0]?'trocado':(Math.abs(g1-r[1])>0.05?'ajustado':'')};
    return {f:f0,g:r[1],idx:idx,from:f0,g0:r[1],sw:''};
  });
}
function optTot(mi,oi){return sumN(mealItems(mi,oi))}
function dayTot(){return MEALS.reduce(function(a,m,mi){return addN(a,optTot(mi,selOf(mi).o))},N0)}
function edited(mi){return Object.keys(selOf(mi).x).length>0}
function anyEdit(){return MEALS.some(function(m,mi){return selOf(mi).o>0||edited(mi)})}
/* quanto de outro alimento do mesmo grupo dá a mesma quantidade do que importa (proteína, carboidrato…) */
function equivs(f,g){
  const kk=EQK[f.gr], have=f[kk]*g/100, out=[];
  if(!(have>=1))return {have:have,kk:kk,list:out};
  const k0=f.k*g/100;
  FLIST.forEach(function(a){
    if(a.id===f.id||a.gr!==f.gr||a.sub!==f.sub||!(a[kk]>0))return;
    const q0=have/a[kk]*100; if(q0<2||q0>700)return;
    const q=snapG(a,q0), key=a[kk]*q/100;
    if(Math.abs(key-have)/have>0.25)return;
    out.push({f:a,g:q,k:a.k*q/100,sc:Math.abs(a.k*q/100-k0)/Math.max(k0,1)+0.5*Math.abs(Math.log(q/g))});
  });
  /* primeiro o que tem calorias parecidas e quantidade parecida com a do original */
  out.sort(function(x,y){return x.sc-y.sc});
  return {have:have,kk:kk,list:out};
}

  const g=FGOAL[k], r=Math.round(v), u=k==='k'?' kcal':' g';
  if(r<g[0])return 'faltam '+K(g[0]-r)+u;
  if(r>g[1])return '+'+K(r-g[1])+u;
  return '✓ na meta';
}

function foodSheetClick(e){
  if(!bsState||!/^(meal|food|new)$/.test(bsState.mode))return;
  const t=e.target.closest('button'); if(!t)return;
  const st=bsState, d=t.dataset;
  if(d.fopt!=null){
    const s=selOf(st.mi), oi=+d.fopt; if(oi!==s.o){s.o=oi;s.x={};foodDirty=true;saveUI()}
    paintBS(mealHtml(st.mi),true);return;
  }
  if(d.fitem!=null){openItem(st.mi,+d.fitem);return}
  if(d.fitemreset!=null){
    const s=selOf(st.mi);
    if(d.fitemreset==='all')s.x={};else delete s.x[+d.fitemreset];
    foodDirty=true;saveUI();
    if(st.mode==='food'){bsState.mode='meal';backToMeal()}else paintBS(mealHtml(st.mi),true);
    return;
  }
  if(d.fback!=null){
    if(st.ctx==='meal'){backToMeal();return}
    const p=st.hist.pop(); if(p){st.fid=p.fid;st.g=p.g;st.more=false;paintBS(foodHtml(),false)}
    return;
  }
  if(d.fqty!=null){
    const f=FOOD[st.fid], u=stepG(f), v=Math.round((st.g+(+d.fqty)*u)*10)/10;
    st.g=Math.max(u>=1?1:u,v); foodUpdate(false);try{navigator.vibrate&&navigator.vibrate(6)}catch(err){}return;
  }
  if(d.fpor!=null){st.g=+d.fpor;foodUpdate(false);return}
  if(d.fmore!=null){st.more=true;document.getElementById('fvEqs').innerHTML=eqHtml(st);return}
  if(d.feq!=null){
    const p=d.feq.split(':'), id=p[0], g=parseFloat(p[1]); if(!FOOD[id])return;
    if(st.ctx==='meal'){st.fid=id;st.g=g;putItem(st);backToMeal()}
    else{st.hist.push({fid:st.fid,g:st.g});st.fid=id;st.g=g;st.more=false;paintBS(foodHtml(),false)}
    return;
  }
  if(d.fdel!=null){
    if(!t.dataset.armed){t.dataset.armed='1';t.textContent='Toque de novo para apagar';return}
    myFoods=myFoods.filter(function(o){return o.id!==st.fid}); saveMine(); rebuildFoods();
    closeBS(); keepRender(); toast('Alimento apagado.'); return;
  }
  if(d.fsave!=null){saveNew();return}
}

/* ---------- Buscar ---------- */
function foodFind(){
  const toks=norm(foodQ).split(/\s+/).filter(Boolean);
  let L=FLIST.filter(function(f){return (!foodG||f.gr===foodG)&&toks.every(function(t){return f._s.indexOf(t)>=0})});
  const per=function(f){return foodB==='c'?100:f.m[0].g};
  const rank=function(f){if(!toks.length)return 0;const n=norm(f.n);return n.indexOf(toks[0])===0?0:n.indexOf(' '+toks[0])>=0?1:2};
  if(foodO==='az')L.sort(function(a,b){return rank(a)-rank(b)||a.n.localeCompare(b.n,'pt-BR')});
  else L.sort(function(a,b){return (b[foodO]*per(b)-a[foodO]*per(a))||a.n.localeCompare(b.n,'pt-BR')});
  return L;
}
function fresHtml(){
  const L=foodFind(), n=L.length;
  if(!n)return '<div class="empty" style="margin:0">Nada encontrado'+(foodQ.trim()?' para “'+esc(foodQ.trim())+'”':'')+'. Confira a escrita ou cadastre o alimento abaixo.</div>';

  L.slice(0,foodShow).forEach(function(f){
    const g=foodB==='c'?100:f.m[0].g, t=nutOf(f,g);
    h+='<li><button class="fr" data-food="'+f.id+'"><span class="fn"><b>'+esc(f.n)+(f.own?'<i class="own">meu</i>':'')+'</b><small>'+(foodB==='c'?'100 '+f.u:qtyTxt(f,g).txt)+'</small></span><span class="fk"><b>'+K(t.k)+'</b><small>kcal</small></span>'+mxl(t)+mxBar(t)+'</button></li>';
  });
  h+='</ul>';
  if(n>foodShow)h+='<button class="btn" data-fmoreres="1" style="margin-top:10px">Mostrar mais ('+(n-foodShow)+')</button>';
  return h;
}

function saveNew(){
  const $=function(id){return document.getElementById(id)}, v={n:$('nfN').value.trim(),gr:$('nfG').value,u:$('nfU').value,por:$('nfP').value,k:$('nfK').value,c:$('nfC').value,p:$('nfPr').value,f:$('nfF').value};
  const por=num(v.por), c=num(v.c)||0, p=num(v.p)||0, f=num(v.f)||0, kk=num(v.k);
  let err='';
  if(!v.n)err='Dê um nome ao alimento.';
  else if(!(por>0&&por<=2000))err='Informe a porção do rótulo, por exemplo 170.';
  else if(c<0||p<0||f<0||kk<0||c>por||p>por||f>por)err='Confira os números: nenhum nutriente passa do peso da porção.';
  else if(!(c+p+f>0||kk>0))err='Informe ao menos calorias ou um nutriente.';
  if(err){paintBS(newHtml(err,v),true);return}
  const k=kk>0?kk:4*c+4*p+9*f, r=100/por;
  const o={id:'u'+Date.now().toString(36),n:v.n,gr:v.gr,u:v.u,por:por,k:Math.round(k*r*10)/10,c:Math.round(c*r*10)/10,p:Math.round(p*r*10)/10,f:Math.round(f*r*10)/10};
  myFoods.push(o); saveMine(); rebuildFoods();
  foodQ=v.n; foodG=''; foodShow=FPAGE; foodTab='buscar'; saveUI();
  closeBS(); render(); window.scrollTo(0,0); toast('Alimento cadastrado.');
}

function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function fmtK(v){v=Math.round(v);return v>=10000?Math.round(v/1000).toLocaleString('pt-BR')+' mil':v.toLocaleString('pt-BR')}
function gymKeyOf(s){if(!s||!s.sets)return null;for(const id in s.sets){if((s.sets[id]||[]).some(function(x){return x&&x.done})){const f=findEx(id);if(f)return f.key}}return null}
function sessVolume(s){let v=0,n=0;for(const id in s.sets){const f=findEx(id);if(!f)continue;(s.sets[id]||[]).forEach(function(x){if(x&&x.done){n++;const kg=num(x.kg),r=num(x.reps);if(!f.ex.time&&kg>0&&r>0)v+=kg*r}})}return {vol:v,sets:n}}
function durMin(s){return (s&&s.startedAt&&s.finishedAt)?Math.max(1,Math.round((s.finishedAt-s.startedAt)/60000)):null}
function runSecs(r){return (num(r.min)||0)*60+(num(r.sec)||0)}
function weekStarts(n){const m=mondayOf(new Date()),a=[];for(let k=n-1;k>=0;k--)a.push(addDays(m,-7*k));return a}
function keyGlyph(k){return k==='pescoco'?'P':FICHA[k].L}
function keyColor(k){return k==='pescoco'?'var(--fX)':FICHA[k].f}
function keyName(k){return k==='pescoco'?'Pescoço em casa':'Treino '+FICHA[k].L}

  let h='<section class="sec"><div class="mnav"><h2>'+cap(MONTHS[mo])+' de '+y+'</h2><div class="wk"><button class="ib" data-pm="-1" aria-label="Mês anterior">'+IC.left+'</button><button class="ib" data-pm="1" aria-label="Próximo mês">'+IC.right+'</button></div></div>'

     +'<details class="acc"><summary><span><b>Ver em tabela</b></span></summary><div class="body"><div class="tw"><table class="t"><thead><tr><th>Semana</th><th class="n">Volume</th><th class="n">Séries</th><th class="n">Treinos</th></tr></thead><tbody>'
     +data.slice().reverse().map(function(d){return '<tr><td>'+d.wk+'</td><td class="n">'+d.v.toLocaleString('pt-BR')+' kg</td><td class="n">'+d.n+'</td><td class="n">'+d.t+'</td></tr>'}).join('')+'</tbody></table></div></div></details>';

function calendar(y,mo){
  const first=new Date(y,mo,1), last=new Date(y,mo+1,0);
  let h='<div class="cal"><div class="hd" aria-hidden="true">'+['S','T','Q','Q','S','S','D'].map(function(d){return '<span>'+d+'</span>'}).join('')+'</div><div class="gd">';
  for(let d=mondayOf(first); !(d>last&&d.getDay()===1); d=addDays(d,1)){
    if(d.getMonth()!==mo){h+='<span class="cd out" aria-hidden="true"></span>';continue}
    const ds=iso(d), s=peek(ds), k=gymKeyOf(s), run=runLogged(s), p=planFor(ds);
    let cls='cd', c='', g='', lab=d.getDate()+' de '+MONTHS[mo]+': ';
    if(k){cls+=' done';c=keyColor(k);g=keyGlyph(k);lab+=keyName(k)+' feito'}
    else if(run){cls+=' done';c='var(--fR)';g=fN(num(s.run.km));lab+='corrida de '+g+' km feita'}
    else{
      if(p.type==='gym')g=FICHA[p.key].L;else if(p.type==='run'){const wk=Math.min(Math.max(blockWeek(ds),1),12);g=fN(p.run==='q'?RUN[wk-1].q.km:RUN[wk-1].l)}else g='P';
      if(ds<TODAY){cls+=' miss';lab+='planejado, sem registro'}else{cls+=' fut';lab+='planejado'}
    }
    if(ds===TODAY){cls+=' today';lab+=', hoje'}
    h+='<button class="'+cls+'" data-open="'+ds+'" style="--c:'+(c||'transparent')+'" aria-label="'+esc(lab)+'"><span class="n">'+d.getDate()+'</span><span class="g">'+g+'</span></button>';
  }
  return h+'</div></div>';
}
function exHistory(id){const out=[];Object.keys(store.sessions).sort().forEach(function(d){const a=(store.sessions[d].sets&&store.sessions[d].sets[id]||[]).filter(function(x){return x&&x.done});if(a.length)out.push({d:d,sets:a})});return out}
function exSeries(ex,hist,alt){
  const rows=hist.map(function(r){return {d:r.d,sets:r.sets.filter(function(x){return isAlt(x)===alt})}}).filter(function(r){return r.sets.length});
  if(!rows.length)return null;
  const mode=ex.time?'s':(!ex.bw&&rows.some(function(r){return r.sets.some(function(x){return num(x.kg)>0})}))?'kg':'reps';
  const pts=[];
  rows.forEach(function(r){let best=null;r.sets.forEach(function(x){const v=mode==='kg'?num(x.kg):num(x.reps);if(v>0&&(!best||v>best.v||(v===best.v&&num(x.reps)>num(best.x.reps))))best={v:v,x:x}});if(best)pts.push({t:parseISO(r.d).getTime(),d:r.d,v:best.v,x:best.x,n:r.sets.length})});
  return {mode:mode,pts:pts,alt:alt,name:exName(ex,alt)};
}
function unitOf(mode){return mode==='kg'?'kg':mode==='s'?'s':'reps'}
function vExProgress(){
  const keys=['infA','supA','infB','supB','treinoE','pescoco'];
  const counts={};let latest=null,latestD='';
  keys.forEach(function(k){S[k].blocks.forEach(function(b){b.ex.forEach(function(ex){const hs=exHistory(ex.id);counts[ex.id]=hs.length;if(hs.length&&hs[hs.length-1].d>latestD){latestD=hs[hs.length-1].d;latest=ex.id}})})});
  if(!progEx||!findEx(progEx))progEx=latest||'sa1';
  let h='<section class="sec" id="exSec"><h2>Evolução por exercício</h2><label class="fl" for="exSel">Exercício</label><select class="in" id="exSel">';
  keys.forEach(function(k){h+='<optgroup label="'+esc(keyName(k))+'">';S[k].blocks.forEach(function(b){b.ex.forEach(function(ex){h+='<option value="'+ex.id+'"'+(ex.id===progEx?' selected':'')+'>'+esc(ex.n)+(counts[ex.id]?' ('+counts[ex.id]+')':'')+'</option>'})});h+='</optgroup>'});
  h+='</select>';
  const ex=findEx(progEx).ex, hist=exHistory(progEx);
  if(!hist.length)return h+'<p class="empty" style="margin-top:12px">Sem registros deste exercício.</p></section>';

    const pick=progExAlt!=null&&progExAlt.id===ex.id?progExAlt.alt:lastVariant(ex.id,'9999');
    main=pick?B:A;
    h+='<div class="seg" role="group" aria-label="Variação no gráfico" style="margin:8px 0 12px"><button data-exv="0" aria-pressed="'+(!main.alt)+'">Principal ('+A.pts.length+')</button><button data-exv="1" aria-pressed="'+main.alt+'">Alternativa ('+B.pts.length+')</button></div>';
  }
  const mode=main.mode, u=unitOf(mode);
  const first=main.pts[0], lastp=main.pts[main.pts.length-1];
  let best=main.pts[0];main.pts.forEach(function(p){if(p.v>best.v)best=p});
  const diff=lastp.v-first.v;
  h+='<p class="trend">'+(main.pts.length>1?'<b class="v">'+(diff>0?'+':'')+fN(diff)+' '+u+'</b>desde '+ddmm(first.d):'Primeiro registro em '+ddmm(first.d)+'.')+'</p>'
   +'<p class="fnote" style="margin-bottom:6px">Melhor: '+fmtSet(ex,best.x,true)+' em '+ddmm(best.d)+'</p>'
   +lineChart('chEx',[{name:main.name,short:main.alt?'Alternativa':'Principal',color:main.alt?'var(--s2)':'var(--s1)',shape:main.alt?'sq':'ci',pts:main.pts.map(function(p){return {t:p.t,d:p.d,v:p.v,txt:fmtSet(ex,p.x,true)+(p.n>1?' ('+p.n+' séries)':'')}})}],{fmt:function(v){return fN(v)},unit:u,aria:'Evolução de '+main.name+' em '+u})
   ;
  h+='<div class="tw" style="margin-top:10px"><table class="t"><thead><tr><th>Data</th><th>Variação</th><th>Séries</th></tr></thead><tbody>'
   +hist.slice().reverse().map(function(r){const alts=r.sets.some(isAlt),mains=r.sets.some(function(x){return !isAlt(x)});return '<tr><td><button class="lnk" data-open="'+r.d+'">'+ddmm(r.d)+'</button></td><td>'+(alts&&mains?'As duas':alts?'Alternativa':'Principal')+'</td><td>'+r.sets.map(function(x){return fmtSet(ex,x,!(alts&&mains))}).join(', ')+'</td></tr>'}).join('')
   +'</tbody></table></div></section>';
  return h;
}
function vHistory(){

  Object.keys(store.sessions).forEach(function(d){const s=store.sessions[d],k=gymKeyOf(s);if(k)items.push({d:d,k:k,s:s});if(runLogged(s))items.push({d:d,run:true,s:s})});

}

function trend(ws){
  const t0=parseISO(ws[0].date),xs=ws.map(function(w){return dayDiff(t0,parseISO(w.date))}),ys=ws.map(function(w){return num(w.kg)}),diff=ys[ys.length-1]-ys[0];
  let o='<p class="trend"><b class="v">'+(diff>=0?'+':'')+f1(diff)+' kg</b>desde '+ddmm(ws[0].date)+'</p>';
  if(xs[xs.length-1]<10)return o+'<p class="fnote">Com 10 dias de registros aparece a tendência semanal.</p>';
  const n=xs.length,mx=xs.reduce(function(a,b){return a+b},0)/n,my=ys.reduce(function(a,b){return a+b},0)/n;let a=0,b=0;for(let i=0;i<n;i++){a+=(xs[i]-mx)*(ys[i]-my);b+=(xs[i]-mx)*(xs[i]-mx)}
  const wk=b?a/b*7:0,msg=wk<0.1?'Abaixo da meta: some 150 a 200 kcal por dia.':wk>0.35?'Acima da meta: tire 100 a 150 kcal por dia.':'Dentro da meta.';
  return o+'<p class="trend">Tendência de <b>'+(wk>=0?'+':'')+wk.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' kg por semana</b> (meta de 0,12 a 0,24). '+msg+'</p>';
}

/* ----- Gráficos (SVG desenhado à mão, com toque e teclado) ----- */
function niceTicks(lo,hi,n,steps){
  if(!(hi>lo)){hi=lo+1;lo=Math.max(0,lo-1)}
  const raw=(hi-lo)/(n-1),mag=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/mag;let st=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*mag;
  if(steps){st=steps[steps.length-1];for(const x of steps){if(Math.ceil(hi/x)-Math.floor(lo/x)<=n){st=x;break}}}
  const a=Math.floor(lo/st+1e-9)*st,b=Math.ceil(hi/st-1e-9)*st,t=[];
  for(let v=a;v<=b+st/2;v+=st)t.push(Math.round(v*1000)/1000);
  return {lo:a,hi:b,ticks:t};
}
function chartBox(id,inner,aria,legend){return '<div class="cw" id="'+id+'" tabindex="0" role="group" aria-label="'+esc(aria)+'. Toque ou use as setas para ver os valores.">'+(legend||'')+inner+'<div class="tt" hidden></div></div>'}
function barChart(id,data,fmt,aria,color){
  const W=340,H=180,L=46,R=8,T=20,B=26,n=data.length,max=Math.max.apply(null,data.map(function(d){return d.v}));
  const tk=niceTicks(0,max||1,4),band=(W-L-R)/n,bw=Math.min(24,band*0.62),ph=H-T-B;
  const y=function(v){return T+ph*(1-v/tk.hi)};
  let s='<svg viewBox="0 0 '+W+' '+H+'" aria-hidden="true">';
  tk.ticks.forEach(function(t){const yy=y(t).toFixed(1);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" style="stroke:var(--rule)" stroke-width="1"/><text x="'+(L-8)+'" y="'+(+yy+4)+'" text-anchor="end" style="fill:var(--ink-2)" font-size="12">'+fmt(t)+'</text>'});
  const cols=[];let lastI=-1;
  data.forEach(function(d,i){
    const cx=L+band*(i+.5),x0=cx-bw/2,x1=cx+bw/2,yt=y(d.v),yb=y(0);
    if(d.v>0){lastI=i;const r=Math.min(4,(yb-yt)/2,bw/2);s+='<path class="b" data-i="'+i+'" d="M'+x0.toFixed(1)+','+yb.toFixed(1)+'V'+(yt+r).toFixed(1)+'Q'+x0.toFixed(1)+','+yt.toFixed(1)+' '+(x0+r).toFixed(1)+','+yt.toFixed(1)+'H'+(x1-r).toFixed(1)+'Q'+x1.toFixed(1)+','+yt.toFixed(1)+' '+x1.toFixed(1)+','+(yt+r).toFixed(1)+'V'+yb.toFixed(1)+'Z" style="fill:'+color+'"/>'}
    else s+='<path class="b" data-i="'+i+'" d="M0,0" style="fill:none"/>';
    s+='<text x="'+cx.toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" style="fill:var(--ink-2)" font-size="12">'+d.lab+'</text>';
    cols.push({x:cx,i:i,html:d.tip});
  });
  if(lastI>=0){const d=data[lastI];s+='<text x="'+(L+band*(lastI+.5)).toFixed(1)+'" y="'+(y(d.v)-6).toFixed(1)+'" text-anchor="middle" style="fill:var(--ink)" font-size="12" font-weight="700">'+fmt(d.v)+'</text>'}
  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(0)+'" y2="'+y(0)+'" style="stroke:var(--ink-2)" stroke-width="1"/></svg>';
  CH[id]={W:W,type:'bar',cols:cols,cur:cols.length-1};
  return chartBox(id,s,aria);
}
function lineChart(id,series,o){
  const W=340,H=190,L=48,R=14,T=22,B=26,ph=H-T-B;
  const all=[];series.forEach(function(se){se.pts.forEach(function(p){all.push(p)})});
  let t0=Math.min.apply(null,all.map(function(p){return p.t})),t1=Math.max.apply(null,all.map(function(p){return p.t}));
  if(t1-t0<2*864e5){t0-=3*864e5;t1+=3*864e5}
  const vals=all.map(function(p){return p.v});if(o.guide)vals.push(o.guide.v0,o.guide.v1);
  let lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);const pad0=(hi-lo)*0.08||Math.max(1,Math.abs(hi)*0.05);
  const tk=niceTicks(Math.max(0,lo-pad0),hi+pad0,o.steps?5:4,o.steps);
  const x=function(t){return L+(W-L-R)*(t-t0)/(t1-t0)}, y=function(v){return o.invert?T+ph*(v-tk.lo)/(tk.hi-tk.lo):T+ph*(tk.hi-v)/(tk.hi-tk.lo)};
  let s='<svg viewBox="0 0 '+W+' '+H+'" aria-hidden="true">';
  tk.ticks.forEach(function(t){const yy=y(t).toFixed(1);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" style="stroke:var(--rule)" stroke-width="1"/><text x="'+(L-8)+'" y="'+(+yy+4)+'" text-anchor="end" style="fill:var(--ink-2)" font-size="12">'+o.fmt(t)+'</text>'});
  const d0=new Date(t0),d1=new Date(t1);
  s+='<text x="'+L+'" y="'+(H-6)+'" style="fill:var(--ink-2)" font-size="12">'+pad(d0.getDate())+'/'+pad(d0.getMonth()+1)+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end" style="fill:var(--ink-2)" font-size="12">'+pad(d1.getDate())+'/'+pad(d1.getMonth()+1)+'</text>';
  if(o.guide)s+='<line x1="'+x(o.guide.t0).toFixed(1)+'" y1="'+y(o.guide.v0).toFixed(1)+'" x2="'+x(o.guide.t1).toFixed(1)+'" y2="'+y(o.guide.v1).toFixed(1)+'" style="stroke:var(--ink-2)" stroke-width="1.5" stroke-dasharray="4 4"/>';
  s+='<line class="xh" x1="0" x2="0" y1="'+T+'" y2="'+(H-B)+'" style="stroke:var(--ink)" stroke-width="1" visibility="hidden"/>';
  const byDay={};
  series.forEach(function(se){
    const pts=se.pts.slice().sort(function(a,b){return a.t-b.t});
    if(pts.length>1)s+='<polyline points="'+pts.map(function(p){return x(p.t).toFixed(1)+','+y(p.v).toFixed(1)}).join(' ')+'" style="fill:none;stroke:'+se.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    pts.forEach(function(p){const px=x(p.t),py=y(p.v);
      s+=se.shape==='sq'?'<rect x="'+(px-4.5).toFixed(1)+'" y="'+(py-4.5).toFixed(1)+'" width="9" height="9" rx="1.5" style="fill:'+se.color+';stroke:var(--paper)" stroke-width="2"/>':'<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="4.5" style="fill:'+se.color+';stroke:var(--paper)" stroke-width="2"/>';
      (byDay[p.d]=byDay[p.d]||{x:px,rows:[]}).rows.push('<span class="tk" style="--c:'+se.color+'"></span>'+(series.length>1?se.short+': ':'')+p.txt);
    });
  });
  if(series.length===1){const pts=series[0].pts,lp=pts.reduce(function(a,b){return b.t>a.t?b:a});const lx=x(lp.t),ly=y(lp.v);s+='<text x="'+Math.min(lx,W-R-2).toFixed(1)+'" y="'+(ly-10).toFixed(1)+'" text-anchor="'+(lx>W-60?'end':'middle')+'" style="fill:var(--ink)" font-size="12" font-weight="700">'+o.fmt(lp.v)+(o.unit&&o.unit!=='/km'?' '+o.unit:'')+'</text>'}
  s+='</svg>';
  const cols=Object.keys(byDay).sort().map(function(d){return {x:byDay[d].x,html:'<b>'+ddmm(d)+'</b><br>'+byDay[d].rows.join('<br>')}});
  CH[id]={W:W,type:'line',cols:cols,cur:cols.length-1};
  const legend=series.length>1?'<div class="legend">'+series.map(function(se){return '<span><i class="lk '+se.shape+'" style="--c:'+se.color+'"></i>'+esc(se.name)+'</span>'}).join('')+'</div>':'';
  return chartBox(id,s,o.aria,legend);
}
function chartAt(w,idx){
  const c=CH[w.id];if(!c||!c.cols.length)return;idx=Math.max(0,Math.min(c.cols.length-1,idx));c.cur=idx;
  const col=c.cols[idx],svg=w.querySelector('svg'),tt=w.querySelector('.tt'),r=svg.getBoundingClientRect(),wr=w.getBoundingClientRect();
  tt.innerHTML=col.html;tt.hidden=false;
  const px=r.left-wr.left+col.x/c.W*r.width,tw=tt.offsetWidth;
  tt.style.left=Math.max(0,Math.min(wr.width-tw,px-tw/2))+'px';
  tt.style.top=(r.top-wr.top)+'px';
  if(c.type==='line'){const xh=svg.querySelector('.xh');xh.setAttribute('x1',col.x);xh.setAttribute('x2',col.x);xh.setAttribute('visibility','visible')}
  else svg.querySelectorAll('.b').forEach(function(b){b.classList.toggle('dim',+b.dataset.i!==col.i)});
}
function chartOff(w){const tt=w.querySelector('.tt');if(tt)tt.hidden=true;const xh=w.querySelector('.xh');if(xh)xh.setAttribute('visibility','hidden');w.querySelectorAll('.b').forEach(function(b){b.classList.remove('dim')})}
function chartPointer(w,e){const c=CH[w.id];if(!c)return;const svg=w.querySelector('svg'),r=svg.getBoundingClientRect();const vx=(e.clientX-r.left)/r.width*c.W;let bi=0,bd=1e9;c.cols.forEach(function(col,i){const d=Math.abs(col.x-vx);if(d<bd){bd=d;bi=i}});chartAt(w,bi)}
$view.addEventListener('pointermove',function(e){const w=e.target.closest('.cw');if(w)chartPointer(w,e)});
$view.addEventListener('pointerdown',function(e){const w=e.target.closest('.cw');document.querySelectorAll('.cw').forEach(function(x){if(x!==w)chartOff(x)});if(w)chartPointer(w,e)});
$view.addEventListener('mouseout',function(e){const w=e.target.closest('.cw');if(w&&!w.contains(e.relatedTarget)&&document.activeElement!==w)chartOff(w)});
$view.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='authPw'){const b=document.getElementById('loginBtn');if(b)b.click();return}const w=e.target.closest('.cw');if(!w||e.target!==w)return;const c=CH[w.id];if(!c)return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();chartAt(w,(c.cur==null?c.cols.length-1:c.cur)+(e.key==='ArrowRight'?1:-1))}});
$view.addEventListener('focusin',function(e){const w=e.target.closest&&e.target.closest('.cw');if(w&&e.target===w){const c=CH[w.id];if(c)chartAt(w,c.cur==null?c.cols.length-1:c.cur)}});
